# Build once, deploy to staging, then promote the same artifact to production
# after a human approves the `production` GitHub Environment.
#
# Infrastructure is managed by Pulumi *locally* (see infra/). CI never runs
# Pulumi: it only uploads the code artifact and updates the existing functions.
#
# Required repo variables (Settings -> Variables):
#   AWS_REGION, ARTIFACT_BUCKET,
#   LAMBDA_STAGING, LAMBDA_PROD,        # function names created by infra/
#   API_URL_STAGING, API_URL_PROD       # base URLs created by infra/
# Optional: LAMBDA_ALIAS_STAGING, LAMBDA_ALIAS_PROD (e.g. "live"; enables
#           version publishing + alias move instead of updating $LATEST),
#           AWS_DEPLOY_ROLE_STAGING, AWS_DEPLOY_ROLE_PROD (if you switch to OIDC)
#
# Required repo secrets:
#   AWS_ACCESS_KEY_ID_STAGING, AWS_SECRET_ACCESS_KEY_STAGING
#   AWS_ACCESS_KEY_ID_PROD,    AWS_SECRET_ACCESS_KEY_PROD
#   RELEASE_TOKEN              # PAT / GitHub App token able to push to protected main
#
# Environments required, exact and lowercase: `staging`, `production`.
# Add required reviewers on `production` -> that is the approval gate.
name: Deploy

on:
  push:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Branch, tag or SHA to deploy
        type: string
        required: false

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"
  PSR_VERSION: "10.7.0"
  AWS_REGION: ${{ vars.AWS_REGION }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}

jobs:
  # Until infra/ has been applied locally and the repo variables are set, deploy
  # jobs are skipped instead of failing on every push. Also breaks the
  # deploy -> release -> deploy loop.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -o pipefail
          if [[ "${HEAD_COMMIT_MESSAGE:-}" == "chore(release):"* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Release commit, nothing to deploy"
            exit 0
          fi
          missing=()
          for name in AWS_REGION ARTIFACT_BUCKET LAMBDA_STAGING LAMBDA_PROD \
                      API_URL_STAGING API_URL_PROD; do
            [ -z "${!name:-}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Missing repo variables: ${missing[*]}"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    uses: ./.github/workflows/_build.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  # Pushes to `development`, or manual dispatch with environment=staging.
  deploy-staging:
    name: deploy / staging
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: |
      needs.preflight.outputs.run == 'true' &&
      (github.event_name == 'push' && github.ref_name == 'development' ||
       github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ vars.API_URL_STAGING }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/download-artifact@v8
        with:
          name: lambda-${{ needs.build.outputs.sha }}
          path: dist

      - name: upload artifact to s3
        run: |
          aws s3 cp dist/lambda.zip \
            "s3://${ARTIFACT_BUCKET}/${{ needs.build.outputs.artifact_key }}" \
            --no-progress --only-show-errors

      - name: update function code
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_STAGING }}
          ALIAS: ${{ vars.LAMBDA_ALIAS_STAGING }}
        run: |
          code_sha=$(aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --s3-bucket "$ARTIFACT_BUCKET" \
            --s3-key "${{ needs.build.outputs.artifact_key }}" \
            --query CodeSha256 --output text --no-cli-pager)
          echo "deployed CodeSha256=$code_sha"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          if [ -n "${ALIAS:-}" ]; then
            version=$(aws lambda publish-version --function-name "$FUNCTION_NAME" \
              --query Version --output text --no-cli-pager)
            aws lambda update-alias --function-name "$FUNCTION_NAME" \
              --name "$ALIAS" --function-version "$version" --no-cli-pager
            echo "::notice title=Deployed::$FUNCTION_NAME version $version -> alias $ALIAS"
          else
            echo "::notice title=Deployed::$FUNCTION_NAME \$LATEST CodeSha256=$code_sha"
          fi

      - name: smoke test
        run: |
          url="${{ vars.API_URL_STAGING }}"
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsS "${url%/}?name=staging"); then
              echo "$body"
              echo "$body" | grep -q "hello, staging" && exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s"
            sleep 5
          done
          echo "::error title=Smoke test failed::$url did not return the expected payload"
          exit 1

  # Pushes to `main`, or manual dispatch with environment=production.
  # The `production` environment's required reviewers are the approval gate, so
  # the prod AWS credentials are only ever used after a human approved.
  deploy-prod:
    name: deploy / production
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: |
      needs.preflight.outputs.run == 'true' &&
      (github.event_name == 'push' && github.ref_name == 'main' ||
       github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: ${{ vars.API_URL_PROD }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/download-artifact@v8
        with:
          name: lambda-${{ needs.build.outputs.sha }}
          path: dist

      - name: upload artifact to s3
        run: |
          aws s3 cp dist/lambda.zip \
            "s3://${ARTIFACT_BUCKET}/${{ needs.build.outputs.artifact_key }}" \
            --no-progress --only-show-errors

      - name: update function code
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_PROD }}
          ALIAS: ${{ vars.LAMBDA_ALIAS_PROD }}
        run: |
          code_sha=$(aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --s3-bucket "$ARTIFACT_BUCKET" \
            --s3-key "${{ needs.build.outputs.artifact_key }}" \
            --query CodeSha256 --output text --no-cli-pager)
          echo "deployed CodeSha256=$code_sha"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          if [ -n "${ALIAS:-}" ]; then
            version=$(aws lambda publish-version --function-name "$FUNCTION_NAME" \
              --query Version --output text --no-cli-pager)
            aws lambda update-alias --function-name "$FUNCTION_NAME" \
              --name "$ALIAS" --function-version "$version" --no-cli-pager
            echo "::notice title=Deployed::$FUNCTION_NAME version $version -> alias $ALIAS"
          else
            echo "::notice title=Deployed::$FUNCTION_NAME \$LATEST CodeSha256=$code_sha"
          fi

      - name: smoke test
        run: |
          url="${{ vars.API_URL_PROD }}"
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsS "${url%/}?name=production"); then
              echo "$body"
              echo "$body" | grep -q "hello, production" && exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s"
            sleep 5
          done
          echo "::error title=Smoke test failed::$url did not return the expected payload"
          exit 1

  # Only after production is healthy, and only for merges to `main` (a manual
  # promotion of an older SHA deploys but does not tag, since that commit is not
  # the head of main and the release commit could not fast-forward).
  # PSR runs with --no-commit/--no-tag/--no-push so the version bump, CHANGELOG
  # and the refreshed uv.lock land in ONE commit with the tag on it.
  release:
    name: release / semantic-release
    runs-on: ubuntu-latest
    needs: [preflight, build, deploy-prod]
    if: |
      needs.preflight.outputs.run == 'true' &&
      github.event_name == 'push' && github.ref_name == 'main'
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # PSR reads the token from GH_TOKEN when publishing the GitHub release.
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          # Must be a token that can bypass branch protection on main, otherwise
          # the release commit is rejected. GITHUB_TOKEN cannot do this.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install

      - name: configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: next
        name: compute next version
        run: |
          current=$(uv version --short)
          next=$(uvx --from "python-semantic-release==${PSR_VERSION}" semantic-release version --print 2>/dev/null | tail -1)
          # `--print` returns the CURRENT version when nothing is releasable, not an
          # empty string, so the comparison (not an emptiness check) is the guard.
          if [ -z "$next" ] || [ "$next" = "$current" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release::No releasable commits since the last tag (still $current)"
          else
            echo "version=$next" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release::$current -> $next"
          fi

      - name: bump version and changelog
        if: steps.next.outputs.version != ''
        run: |
          uvx --from "python-semantic-release==${PSR_VERSION}" semantic-release version \
            --no-commit --no-tag --no-push

      - name: sync uv.lock with the new version
        if: steps.next.outputs.version != ''
        run: uv lock

      - name: commit, tag and push
        if: steps.next.outputs.version != ''
        run: |
          version="${{ steps.next.outputs.version }}"
          git add --all
          git commit -m "chore(release): $version"
          git tag -a "v$version" -m "v$version"
          git push origin HEAD:main --follow-tags

      - name: publish github release
        if: steps.next.outputs.version != ''
        run: |
          uvx --from "python-semantic-release==${PSR_VERSION}" semantic-release publish

      - name: verify nothing was left uncommitted
        if: steps.next.outputs.version != ''
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Release left uncommitted changes::"
            git status --short
            exit 1
          fi
