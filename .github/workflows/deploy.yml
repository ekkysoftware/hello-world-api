name: Deploy

on:
  push:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: Branch, tag or SHA to deploy
        type: string
        required: false
      artifact_key:
        description: "Promote an existing lambda/<sha256>.zip (production only, skips the build)"
        type: string
        required: false

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"
  PSR_VERSION: "10.7.0"
  AWS_REGION: ${{ vars.AWS_REGION }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      sha: ${{ steps.check.outputs.sha }}
      need_build: ${{ steps.check.outputs.need_build }}
      artifact_key: ${{ steps.check.outputs.artifact_key }}
    steps:
      - id: check
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_ARTIFACT_KEY: ${{ inputs.artifact_key }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -o pipefail
          echo "sha=${INPUT_REF:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"

          if [ -n "${INPUT_ARTIFACT_KEY:-}" ]; then
            if [ "${INPUT_ENVIRONMENT:-}" = "staging" ]; then
              echo "::error title=Unsupported::artifact_key only applies to environment=production"
              exit 1
            fi
            if [[ ! "$INPUT_ARTIFACT_KEY" =~ ^lambda/[0-9a-f]{64}\.zip$ ]]; then
              echo "::error title=Invalid artifact_key::Expected lambda/<64 hex>.zip, got '$INPUT_ARTIFACT_KEY'"
              exit 1
            fi
            echo "need_build=false" >> "$GITHUB_OUTPUT"
            echo "artifact_key=$INPUT_ARTIFACT_KEY" >> "$GITHUB_OUTPUT"
          else
            echo "need_build=true" >> "$GITHUB_OUTPUT"
            echo "artifact_key=" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${HEAD_COMMIT_MESSAGE:-}" == "chore(release):"* ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Release commit, nothing to deploy"
            exit 0
          fi
          missing=()
          for name in AWS_REGION ARTIFACT_BUCKET LAMBDA_STAGING LAMBDA_PROD \
                      API_URL_STAGING API_URL_PROD; do
            [ -z "${!name:-}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Missing repo variables: ${missing[*]}"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build
    needs: preflight
    if: needs.preflight.outputs.run == 'true' && needs.preflight.outputs.need_build == 'true'
    uses: ./.github/workflows/_build.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  deploy-staging:
    name: deploy / staging
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: |
      needs.preflight.outputs.run == 'true' &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' && github.ref_name == 'development' ||
       github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ vars.API_URL_STAGING }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/download-artifact@v8
        with:
          name: lambda-${{ needs.build.outputs.sha }}
          path: dist

      - name: publish artifact
        env:
          KEY: ${{ needs.build.outputs.artifact_key }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          expected=$(sha256sum dist/lambda.zip | cut -d' ' -f1)
          if [ "$expected" != "$SHA256" ]; then
            echo "::error title=Artifact mismatch::downloaded $expected != reported $SHA256"
            exit 1
          fi
          if aws s3api head-object --bucket "$ARTIFACT_BUCKET" --key "$KEY" >/dev/null 2>&1; then
            echo "::notice title=Artifact present::$KEY already uploaded, left untouched"
          else
            aws s3 cp dist/lambda.zip "s3://${ARTIFACT_BUCKET}/$KEY" \
              --no-progress --only-show-errors
          fi

      - name: update function code
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_STAGING }}
          ALIAS: ${{ vars.LAMBDA_ALIAS_STAGING }}
          KEY: ${{ needs.build.outputs.artifact_key }}
        run: |
          code_sha=$(aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --s3-bucket "$ARTIFACT_BUCKET" \
            --s3-key "$KEY" \
            --query CodeSha256 --output text --no-cli-pager)
          echo "deployed CodeSha256=$code_sha"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          if [ -n "${ALIAS:-}" ]; then
            version=$(aws lambda publish-version --function-name "$FUNCTION_NAME" \
              --query Version --output text --no-cli-pager)
            aws lambda update-alias --function-name "$FUNCTION_NAME" \
              --name "$ALIAS" --function-version "$version" --no-cli-pager
            echo "::notice title=Deployed::$FUNCTION_NAME version $version -> alias $ALIAS"
          else
            echo "::notice title=Deployed::$FUNCTION_NAME \$LATEST CodeSha256=$code_sha"
          fi

      - name: smoke test
        run: |
          url="${{ vars.API_URL_STAGING }}"
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsS "${url%/}?name=staging"); then
              echo "$body"
              echo "$body" | grep -q "hello, staging" && exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s"
            sleep 5
          done
          echo "::error title=Smoke test failed::$url did not return the expected payload"
          exit 1

      - name: summary
        if: always()
        run: |
          {
            echo "### Deploy / staging"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| function | \`${{ vars.LAMBDA_STAGING }}\` |"
            echo "| artifact | \`${{ needs.build.outputs.artifact_key }}\` |"
            echo "| url | ${{ vars.API_URL_STAGING }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: deploy / production
    runs-on: ubuntu-latest
    needs: [preflight, build]
    # always() because build is skipped when promoting an existing artifact.
    if: |
      always() &&
      needs.preflight.outputs.run == 'true' &&
      needs.build.result != 'failure' &&
      needs.build.result != 'cancelled' &&
      (github.event_name == 'push' && github.ref_name == 'main' ||
       github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: ${{ vars.API_URL_PROD }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: source
        name: resolve artifact
        env:
          INPUT_KEY: ${{ needs.preflight.outputs.artifact_key }}
          BUILT_KEY: ${{ needs.build.outputs.artifact_key }}
        run: |
          key="${INPUT_KEY:-$BUILT_KEY}"
          if [ -z "$key" ]; then
            echo "::error title=No artifact::Neither artifact_key nor a build result is available"
            exit 1
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "::notice title=Promoting::$key"

      - uses: actions/download-artifact@v8
        if: needs.build.result == 'success'
        with:
          name: lambda-${{ needs.build.outputs.sha }}
          path: dist

      - name: publish artifact (only when absent)
        env:
          KEY: ${{ steps.source.outputs.key }}
        run: |
          if aws s3api head-object --bucket "$ARTIFACT_BUCKET" --key "$KEY" >/dev/null 2>&1; then
            echo "::notice title=Reusing::$KEY already exists, promoting the staged bytes unchanged"
          else
            aws s3 cp dist/lambda.zip "s3://${ARTIFACT_BUCKET}/$KEY" \
              --no-progress --only-show-errors
          fi

      - name: verify artifact integrity
        env:
          KEY: ${{ steps.source.outputs.key }}
        run: |
          expected="${KEY#lambda/}"
          expected="${expected%.zip}"
          actual=$(aws s3 cp "s3://${ARTIFACT_BUCKET}/${KEY}" - \
            --no-progress --only-show-errors | sha256sum | cut -d' ' -f1)
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Artifact integrity::$KEY hashes to $actual"
            exit 1
          fi
          echo "verified $KEY sha256=$actual"

      - name: update function code
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_PROD }}
          ALIAS: ${{ vars.LAMBDA_ALIAS_PROD }}
          KEY: ${{ steps.source.outputs.key }}
        run: |
          code_sha=$(aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --s3-bucket "$ARTIFACT_BUCKET" \
            --s3-key "$KEY" \
            --query CodeSha256 --output text --no-cli-pager)
          echo "deployed CodeSha256=$code_sha"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          if [ -n "${ALIAS:-}" ]; then
            version=$(aws lambda publish-version --function-name "$FUNCTION_NAME" \
              --query Version --output text --no-cli-pager)
            aws lambda update-alias --function-name "$FUNCTION_NAME" \
              --name "$ALIAS" --function-version "$version" --no-cli-pager
            echo "::notice title=Deployed::$FUNCTION_NAME version $version -> alias $ALIAS"
          else
            echo "::notice title=Deployed::$FUNCTION_NAME \$LATEST CodeSha256=$code_sha"
          fi

      - name: smoke test
        run: |
          url="${{ vars.API_URL_PROD }}"
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsS "${url%/}?name=production"); then
              echo "$body"
              echo "$body" | grep -q "hello, production" && exit 0
            fi
            echo "attempt $attempt failed, retrying in 5s"
            sleep 5
          done
          echo "::error title=Smoke test failed::$url did not return the expected payload"
          exit 1

      - name: summary
        if: always()
        run: |
          {
            echo "### Deploy / production"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| function | \`${{ vars.LAMBDA_PROD }}\` |"
            echo "| artifact | \`${{ steps.source.outputs.key }}\` |"
            echo "| rebuilt | ${{ needs.build.result == 'success' }} |"
            echo "| url | ${{ vars.API_URL_PROD }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: release / semantic-release
    runs-on: ubuntu-latest
    needs: [preflight, deploy-prod]
    if: |
      needs.preflight.outputs.run == 'true' &&
      github.event_name == 'push' && github.ref_name == 'main'
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install

      - name: configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: next
        name: compute next version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          current=$(uv version --short)
          next=$(uvx --from "python-semantic-release==${PSR_VERSION}" semantic-release version --print 2>/dev/null | tail -1)
          if [ -z "$next" ] || [ "$next" = "$current" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release::No releasable commits since the last tag (still $current)"
          else
            echo "version=$next" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release::$current -> $next"
          fi

      - name: bump version and changelog
        if: steps.next.outputs.version != ''
        run: |
          uvx --from "python-semantic-release==${PSR_VERSION}" semantic-release version \
            --no-commit --no-tag --no-push

      - name: sync uv.lock with the new version
        if: steps.next.outputs.version != ''
        run: uv lock

      - name: commit, tag and push
        if: steps.next.outputs.version != ''
        run: |
          version="${{ steps.next.outputs.version }}"
          git add --all
          git commit -m "chore(release): $version"
          git tag -a "v$version" -m "v$version"
          git push origin HEAD:main --follow-tags

      - name: publish github release
        if: steps.next.outputs.version != ''
        run: |
          uvx --from "python-semantic-release==${PSR_VERSION}" semantic-release publish

      - name: verify nothing was left uncommitted
        if: steps.next.outputs.version != ''
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Release left uncommitted changes::"
            git status --short
            exit 1
          fi
