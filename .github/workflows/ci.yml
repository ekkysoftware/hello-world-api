# PR gates. No AWS credentials, no Pulumi: this must stay runnable by anyone.
name: CI

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --group dev
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check --diff .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q

  # Same steps deploy.yml runs, so a green PR really does mean "this packages
  # and the handler imports". The artifact is not uploaded here: PR runs would
  # burn the Actions storage quota for nothing.
  package:
    name: package
    uses: ./.github/workflows/_build.yml
    with:
      upload-artifact: false
